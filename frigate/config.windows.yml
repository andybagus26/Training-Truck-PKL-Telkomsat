mqtt:
  enabled: true
  # Nama layanan broker di docker-compose.yml, BUKAN localhost: di dalam container, localhost berarti
  # container Frigate sendiri, sehingga Frigate tidak pernah tersambung ke broker dan backend tidak
  # menerima posisi objek (kotak keadaan di Dashboard tidak muncul, aktivitas tidak tercatat).
  host: mosquitto
  port: 1883

# ─── DETECTOR ─────────────────────────────────────────────────────────────
# Windows: uses Frigate's built-in ONNX Runtime CPU detector.
# No need for apple-silicon-detector like on Mac — simpler setup!
# Have an NVIDIA GPU? Change to: type: tensorrt
detectors:
  onnx_cpu:
    type: onnx

# ─── FFMPEG (Hardware Acceleration) ────────────────────────────────────────
# VAAPI helps decode video using the AMD Radeon 780M iGPU, reducing CPU load.
# Di WSL sering kali device VAAPI tidak terdeteksi sehingga ffmpeg crash dengan error:
# "Option hwaccel cannot be applied to output url vaapi".
# Uncomment jika VAAPI sudah terkonfigurasi dengan benar di environment Docker/WSL.
# ffmpeg:
#   hwaccel_args: preset-vaapi

# ─── MODEL ────────────────────────────────────────────────────────────────
model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /models/mining_truck_yolov9t_320_v6.onnx
  labelmap_path: /models/labelmap_v6.txt

# ─── OBJECTS ──────────────────────────────────────────────────────────────
objects:
  track:
    - truck
    - full_load
    - empty_load
    - excavator
    - bed_raised
  filters:
    bed_raised:
      min_score: 0.5
      threshold: 0.6
    excavator:
      min_score: 0.5
      threshold: 0.6
    truck:
      min_score: 0.45
      threshold: 0.6
    full_load:
      min_score: 0.5
      threshold: 0.6
    empty_load:
      min_score: 0.5
      threshold: 0.6

# ─── SNAPSHOTS ────────────────────────────────────────────────────────────
# Foto tiap deteksi. Tanpa ini tabel "Deteksi terbaru" di Dashboard tampil tanpa foto.
# Disamakan dengan config.yml (Mac).
snapshots:
  enabled: true
  bounding_box: true
  retain:
    default: 3

# ─── RECORDING ────────────────────────────────────────────────────────────
record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 0
  alerts:
    retain:
      days: 3
      mode: active_objects
  detections:
    retain:
      days: 3
      mode: active_objects

# ─── CAMERAS ──────────────────────────────────────────────────────────────
cameras:
  truck_cam:
    ffmpeg:
      inputs:
        - path: /config/cctv_short.mp4
          input_args: -re -stream_loop -1
          roles:
            - detect
            - record
    detect:
      fps: 5
      width: 1280
      height: 720
      enabled: true
    record:
      enabled: true
    zones:
      area_loading:
        friendly_name: Area Loading
        coordinates: 0.0,0.6,0.6,0.6,0.6,1.0,0.0,1.0
        objects:
          - truck
        loitering_time: 15
    review:
      alerts:
        labels:
          - truck
        required_zones:
          - area_loading

  truck_cam_3:
    ffmpeg:
      inputs:
        - path: /config/truck_cam_3.mp4
          input_args: -re -stream_loop -1
          roles:
            - detect
            - record
    detect:
      fps: 5
      width: 768
      height: 432
      enabled: true
    record:
      enabled: true

  truck_excavator_night:
    ffmpeg:
      inputs:
        - path: /config/truck_excavator_night.mp4
          input_args: -re -stream_loop -1
          roles:
            - detect
            - record
    detect:
      fps: 5
      width: 1280
      height: 720
      enabled: true
    record:
      enabled: true

  cctv5:
    ffmpeg:
      inputs:
        - path: /config/cctv5.mp4
          input_args: -re -stream_loop -1
          roles:
            - detect
            - record
    detect:
      fps: 5
      enabled: true
    record:
      enabled: true

  cctv_truck4:
    ffmpeg:
      inputs:
        - path: /config/cctv_truck4.mp4
          input_args: -re -stream_loop -1
          roles:
            - detect
            - record
    detect:
      fps: 5
      enabled: true
    record:
      enabled: true

  truck_cam_2:
    ffmpeg:
      inputs:
        - path: /config/cctv_truck2.mp4
          input_args: -re -stream_loop -1
          roles:
            - detect
            - record
    detect:
      fps: 5
      width: 1280
      height: 720
      enabled: true
    record:
      enabled: true

version: 0.18-0
