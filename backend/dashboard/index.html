<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemantau Truk Tambang</title>
<style>
  :root {
    --bg: #11131a; --panel: #191c26; --line: #262b38; --text: #e7e9ef; --muted: #8b93a7;
    --moving: #4a9eff; --loading: #ffb020; --dumping: #c46bff; --idle: #ff5f57; --ok: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
       margin: 24px 0 10px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .grid { display: grid; gap: 12px; }
  .cams { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; background: #000; }
  .card .body { padding: 10px 12px; }
  .card .name { font-weight: 600; margin-bottom: 6px; }
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #0d0f15; margin: 8px 0 6px; }
  .bar span { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .05em; padding: 6px 10px; }
  td { padding: 8px 10px; border-top: 1px solid var(--line); }
  tbody tr:hover { background: #1e222e; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .b-moving  { background: rgba(74,158,255,.15);  color: var(--moving); }
  .b-loading { background: rgba(255,176,32,.15);  color: var(--loading); }
  .b-dumping { background: rgba(196,107,255,.15); color: var(--dumping); }
  .b-idle    { background: rgba(255,95,87,.15);   color: var(--idle); }
  .b-unknown { background: rgba(139,147,167,.15); color: var(--muted); }
  .status { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
  .pill { background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
          padding: 4px 12px; font-size: 12px; color: var(--muted); }
  .pill b { color: var(--text); font-weight: 600; }
  .up { color: var(--ok); } .down { color: var(--idle); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 14px 10px; font-size: 13px; }
  @media (max-width: 640px) { body { padding: 12px; } td, th { padding: 6px; } }
</style>
</head>
<body>
  <h1>Pemantau Truk Tambang</h1>
  <div class="sub">Data diambil dari backend tiap 3 detik. Rentang hitungan: 30 menit terakhir.</div>

  <div class="status" id="status"></div>

  <h2>Kamera</h2>
  <div class="grid cams" id="cams"></div>

  <h2>Truk yang sedang terlihat</h2>
  <div class="card"><table id="live"></table></div>

  <h2>Aktivitas terakhir</h2>
  <div class="card"><table id="acts"></table></div>

<script>
const WINDOW_MIN = 30;
const STATES = ["moving", "loading", "dumping", "idle"];
const COLOR = { moving: "var(--moving)", loading: "var(--loading)",
                dumping: "var(--dumping)", idle: "var(--idle)" };

const get = (path) => fetch(path).then(r => r.ok ? r.json() : Promise.reject(r.status));
const detik = (v) => v == null ? "–" : v >= 60 ? `${Math.floor(v/60)}m ${Math.round(v%60)}s` : `${Math.round(v)}s`;
const jam = (iso) => iso ? new Date(iso).toLocaleTimeString("id-ID", {hour12: false}) : "–";
const badge = (s) => `<span class="badge b-${s || "unknown"}">${s || "?"}</span>`;

function renderStatus(health, poller) {
  const mq = poller.mqtt || {};
  document.getElementById("status").innerHTML = `
    <span class="pill">Frigate <b class="${health.frigate_reachable ? "up" : "down"}">
      ${health.frigate_reachable ? "tersambung" : "tidak terjangkau"}</b></span>
    <span class="pill">Sumber data <b>${poller.source || "–"}</b></span>
    <span class="pill">MQTT <b class="${mq.connected ? "up" : "down"}">
      ${mq.connected ? "tersambung" : "putus"}</b></span>
    <span class="pill">Objek terpantau <b>${mq.tracked_objects ?? 0}</b></span>
    <span class="pill">Aktivitas tersimpan <b>${poller.activities_in_db ?? 0}</b></span>
    <span class="pill">Diperbarui <b>${new Date().toLocaleTimeString("id-ID", {hour12: false})}</b></span>`;
}

function renderCameras(ops) {
  const host = document.getElementById("cams");
  if (!ops.length) { host.innerHTML = `<div class="empty">Belum ada truk terpantau.</div>`; return; }
  // Gambar hanya dibuat sekali lalu disegarkan, supaya tidak berkedip tiap pembaruan.
  host.innerHTML = ops.map(c => {
    const total = Object.values(c.seconds).reduce((a, b) => a + b, 0) || 1;
    const bar = STATES.filter(s => c.seconds[s])
      .map(s => `<span style="width:${c.seconds[s] / total * 100}%;background:${COLOR[s]}"></span>`).join("");
    const legend = STATES.filter(s => c.seconds[s])
      .map(s => `<span><i class="dot" style="background:${COLOR[s]}"></i>${s} ${detik(c.seconds[s])}</span>`).join("");
    const ev = Object.entries(c.events || {})
      .map(([k, v]) => `${k} ${v.count}× rata-rata ${detik(v.average_seconds)}`).join(" · ") || "belum ada yang selesai";
    return `<div class="card">
      <img data-cam="${c.camera}" alt="${c.camera}">
      <div class="body">
        <div class="name">${c.camera}</div>
        <div class="muted" style="font-size:12px">${c.trucks_seen} truk ·
          menganggur ${c.idle_share == null ? "–" : Math.round(c.idle_share * 100) + "%"}</div>
        <div class="bar">${bar}</div>
        <div class="legend">${legend}</div>
        <div class="muted" style="font-size:11px;margin-top:8px">${ev}</div>
      </div></div>`;
  }).join("");
  refreshThumbs();
}

function refreshThumbs() {
  document.querySelectorAll("img[data-cam]").forEach(img => {
    img.src = `/cameras/${img.dataset.cam}/latest?bbox=true&height=360&t=${Date.now()}`;
  });
}

function renderLive(rows) {
  const t = document.getElementById("live");
  if (!rows.length) { t.innerHTML = `<tr><td class="empty">Tidak ada truk terlihat saat ini.</td></tr>`; return; }
  t.innerHTML = `<thead><tr><th>Kamera</th><th>Truk</th><th>Keadaan</th><th>Muatan</th>
      <th>Excavator dekat</th><th>Aktivitas berjalan</th></tr></thead><tbody>` +
    rows.map(r => `<tr>
      <td>${r.camera}</td>
      <td class="muted">…${r.truck_id.slice(-7)}</td>
      <td>${badge(r.state)}</td>
      <td>${r.load_state || "<span class='muted'>–</span>"}</td>
      <td class="muted">${r.excavator_nearby ? "…" + r.excavator_nearby.slice(-7) : "–"}</td>
      <td>${r.activity ? `${r.activity} · ${detik(r.activity_seconds)}` : "<span class='muted'>–</span>"}</td>
    </tr>`).join("") + `</tbody>`;
}

function renderActs(rows) {
  const t = document.getElementById("acts");
  if (!rows.length) { t.innerHTML = `<tr><td class="empty">Belum ada aktivitas tercatat.</td></tr>`; return; }
  t.innerHTML = `<thead><tr><th>Jenis</th><th>Kamera</th><th>Mulai</th><th>Durasi</th>
      <th>Muatan</th><th>Status</th></tr></thead><tbody>` +
    rows.slice(0, 20).map(a => `<tr>
      <td>${badge(a.type)}</td>
      <td>${a.camera}</td>
      <td class="muted">${jam(a.start_time)}</td>
      <td>${detik(a.duration_seconds)}</td>
      <td class="muted">${a.load_before || "–"} → ${a.load_after || "–"}</td>
      <td>${a.ongoing ? "<span class='up'>berjalan</span>" : "<span class='muted'>selesai</span>"}</td>
    </tr>`).join("") + `</tbody>`;
}

async function tick() {
  try {
    const [health, poller, ops, live, acts] = await Promise.all([
      get("/health"), get("/poller"),
      get(`/operations?since_minutes=${WINDOW_MIN}`),
      get("/trucks/live"),
      get(`/activities?since_minutes=${WINDOW_MIN}&limit=20`),
    ]);
    renderStatus(health, poller);
    renderCameras(ops);
    renderLive(live);
    renderActs(acts);
  } catch (e) {
    document.getElementById("status").innerHTML =
      `<span class="pill">Backend <b class="down">tidak terjangkau</b> — pastikan uvicorn berjalan di port 8000</span>`;
  }
}

tick();
setInterval(tick, 3000);
</script>
</body>
</html>
